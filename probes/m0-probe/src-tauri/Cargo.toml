[package]
name = "m0-probe"
version = "0.1.0"
description = "HiFiShifter Android 移植 · M0 技术卡点探针"
edition = "2021"
default-run = "m0-probe"

[lib]
# Android 需要 staticlib（Tauri mobile 入口）+ cdylib
name = "m0_probe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "m0-probe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.16"

# ── Android ────────────────────────────────────────────────────────────────
# cpal：Android 后端是 Oboe。必须显式开 oboe-shared-stdcxx，否则真机报
#       dlopen failed: library "libc++_shared.so" not found
# ort ：走 load-dynamic，libonnxruntime.so 由 jniLibs/arm64-v8a/ 提供
#       不用 download-binaries（Android 的二进制不走 pykeio 下载通道）
[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15.3", default-features = false, features = ["oboe-shared-stdcxx"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tls-native", "load-dynamic"] }
ndk = "0.9"
ndk-context = "0.1"
jni = "0.21"

# ── 桌面（仅用于快速迭代：代码能编过、逻辑能跑）────────────────────────────
[target.'cfg(not(target_os = "android"))'.dependencies]
cpal = "0.15"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tls-native", "load-dynamic"] }

# 构建期变量
[features]
default = []

[profile.release]
opt-level = 2
strip = false
