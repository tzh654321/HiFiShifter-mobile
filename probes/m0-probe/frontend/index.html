<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>M0 探针</title>
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #1c1c1a;
                color: #e8e8e4;
                font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
                padding: 12px;
                padding-bottom: env(safe-area-inset-bottom);
            }
            h1 {
                font-size: 16px;
                font-weight: 500;
                margin: 4px 0 10px;
            }
            .hint {
                color: #b4b2a9;
                font-size: 12px;
                margin-bottom: 12px;
            }
            .btns {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 12px;
            }
            button {
                /* 触摸目标 ≥44px：探针 UI 也照这个规范做，顺便当一次排版自检 */
                min-height: 44px;
                min-width: 96px;
                padding: 0 14px;
                font-size: 14px;
                border-radius: 8px;
                border: 0.5px solid #b4b2a9;
                background: #444441;
                color: #fff;
                font-family: inherit;
            }
            button.primary {
                background: #3c3489;
                border-color: #cecbf6;
            }
            button.danger {
                background: #791f1f;
                border-color: #f09595;
            }
            #out {
                white-space: pre-wrap;
                word-break: break-all;
                background: #2c2c2a;
                border: 0.5px solid #5f5e5a;
                border-radius: 8px;
                padding: 10px;
                font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
                font-size: 11.5px;
                min-height: 240px;
                max-height: 62vh;
                overflow: auto;
            }
            .ok {
                color: #97c459;
            }
            .bad {
                color: #f09595;
            }
            .warn {
                color: #ef9f27;
            }
            .dim {
                color: #888780;
            }
        </style>
    </head>
    <body>
        <h1>HiFiShifter · M0 技术卡点探针</h1>
        <div class="hint">
            日志同时写入 logcat：<code>adb logcat -s RustStdout:V RustStderr:V</code>
        </div>

        <div class="btns">
            <button class="primary" id="all">跑全部</button>
            <button id="env">0 环境路径</button>
            <button id="ndk">1 NDK 上下文</button>
            <button id="cpal">2 cpal 出声</button>
            <button id="assets">4 assets 拷贝</button>
            <button id="ort_init">3a ort 运行时</button>
            <button id="ort_model">3b 加载模型</button>
            <button class="danger" id="clear">清空</button>
        </div>

        <div id="out">就绪。</div>

        <script>
            const out = document.getElementById("out");
            const invoke = (...a) => window.__TAURI__.core.invoke(...a);

            let logCache = [];

            function render() {
                out.innerHTML = logCache
                    .map((line) => {
                        const esc = line
                            .replace(/&/g, "&amp;")
                            .replace(/</g, "&lt;")
                            .replace(/>/g, "&gt;");
                        let cls = "";
                        if (line.includes("✅")) cls = "ok";
                        else if (line.includes("❌")) cls = "bad";
                        else if (line.includes("⚠️")) cls = "warn";
                        else if (line.startsWith("══") || line.includes("👉"))
                            cls = "dim";
                        return cls
                            ? `<span class="${cls}">${esc}</span>`
                            : esc;
                    })
                    .join("\n");
                out.scrollTop = out.scrollHeight;
            }

            async function poll() {
                try {
                    const next = await invoke("read_log");
                    if (next.length !== logCache.length) {
                        logCache = next;
                        render();
                    }
                } catch (e) {
                    /* 启动早期可能还没就绪，忽略 */
                }
            }
            setInterval(poll, 400);
            poll();

            async function run(name, arg) {
                logCache.push(`\n>>> 触发探针：${name}${arg ? " (" + arg + ")" : ""}`);
                render();
                try {
                    await invoke("run_probe", { name, arg: arg || null });
                } catch (e) {
                    logCache.push(`❌ 触发失败：${e}`);
                    render();
                }
            }

            document.getElementById("all").onclick = () => run("all");
            document.getElementById("env").onclick = () => run("env");
            document.getElementById("ndk").onclick = () => run("ndk");
            document.getElementById("cpal").onclick = () => run("cpal", "3");
            document.getElementById("assets").onclick = () => run("assets");
            document.getElementById("ort_init").onclick = () => run("ort_init");
            document.getElementById("ort_model").onclick = async () => {
                const dir = await invoke("app_data_dir");
                const p = `${dir}/models/nsf_hifigan/pc_nsf_hifigan.onnx`;
                run("ort_model", p);
            };
            document.getElementById("clear").onclick = async () => {
                await invoke("clear_log");
                logCache = [];
                render();
            };
        </script>
    </body>
</html>
